<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 5 texture generator</title>
</head>
<body>
<script>
// Texture generator for Level 5. The Node script passes CC0 source scans in as
// data URLs; this page draws the ornamental patterns, blends in the scanned
// surface detail, and returns tileable WebP data URLs.
const PALETTE = {
    field: '#86171a',
    fieldDark: '#5a0b0d',
    gold: '#c59848',
    cream: '#e7cf96',
    brown: '#5b3218',
    wine: '#3f0708',
};

function seededRandom(seed) {
    let state = seed >>> 0;
    return () => {
        state = (state + 0x6D2B79F5) >>> 0;
        let value = Math.imul(state ^ (state >>> 15), 1 | state);
        value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value;
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
    };
}

function loadImage(source) {
    return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = source;
    });
}

function createCanvas(width, height = width) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    return canvas;
}

// Draw a motif at every wrapped copy that touches the tile, so the tile repeats seamlessly.
function drawWrapped(context, size, x, y, reach, draw) {
    for (const offsetX of [-size, 0, size]) {
        for (const offsetY of [-size, 0, size]) {
            const px = x + offsetX;
            const py = y + offsetY;
            if (px + reach < 0 || px - reach > size || py + reach < 0 || py - reach > size) continue;
            context.save();
            context.translate(px, py);
            draw(context);
            context.restore();
        }
    }
}

function luminanceField(image, width, height) {
    const canvas = createCanvas(width, height);
    const context = canvas.getContext('2d');
    context.drawImage(image, 0, 0, width, height);
    const { data } = context.getImageData(0, 0, width, height);
    const field = new Float32Array(width * height);
    let total = 0;
    for (let index = 0; index < field.length; index++) {
        const value = data[index * 4] * 0.299 + data[index * 4 + 1] * 0.587 + data[index * 4 + 2] * 0.114;
        field[index] = value;
        total += value;
    }
    const mean = total / field.length;
    for (let index = 0; index < field.length; index++) field[index] /= mean;
    return field;
}

// Multiply a drawn pattern by normalised scan luminance to add real fibre/weave detail.
function applyDetail(canvas, field, strength, random, speckle = 0) {
    const context = canvas.getContext('2d');
    const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
    const { data } = pixels;
    for (let index = 0; index < field.length; index++) {
        const factor = Math.max(0.35, 1 + (field[index] - 1) * strength + (random() - 0.5) * speckle);
        data[index * 4] = Math.min(255, data[index * 4] * factor);
        data[index * 4 + 1] = Math.min(255, data[index * 4 + 1] * factor);
        data[index * 4 + 2] = Math.min(255, data[index * 4 + 2] * factor);
    }
    context.putImageData(pixels, 0, 0);
}

function leaf(context, inner, outer, width, fill, stroke) {
    context.beginPath();
    context.moveTo(0, -inner);
    context.bezierCurveTo(width, -inner - (outer - inner) * 0.3, width * 0.8, -inner - (outer - inner) * 0.78, 0, -outer);
    context.bezierCurveTo(-width * 0.8, -inner - (outer - inner) * 0.78, -width, -inner - (outer - inner) * 0.3, 0, -inner);
    context.fillStyle = fill;
    context.fill();
    context.lineWidth = 5;
    context.strokeStyle = stroke;
    context.stroke();
}

function medallion(context) {
    for (let index = 0; index < 16; index++) {
        const angle = index * Math.PI / 8;
        context.beginPath();
        context.arc(Math.cos(angle) * 176, Math.sin(angle) * 176, 7, 0, Math.PI * 2);
        context.fillStyle = PALETTE.cream;
        context.fill();
    }
    for (let index = 0; index < 8; index++) {
        context.save();
        context.rotate(index * Math.PI / 4);
        leaf(context, 38, 154, 40, index % 2 ? PALETTE.gold : PALETTE.brown, PALETTE.wine);
        context.beginPath();
        context.moveTo(0, -54);
        context.quadraticCurveTo(9, -98, 0, -134);
        context.lineWidth = 4;
        context.strokeStyle = PALETTE.cream;
        context.stroke();
        context.restore();
    }
    for (let index = 0; index < 4; index++) {
        context.save();
        context.rotate(index * Math.PI / 2 + Math.PI / 4);
        context.beginPath();
        context.arc(0, -36, 30, 0, Math.PI * 2);
        context.fillStyle = PALETTE.cream;
        context.fill();
        context.lineWidth = 5;
        context.strokeStyle = PALETTE.wine;
        context.stroke();
        context.restore();
    }
    context.beginPath();
    context.arc(0, 0, 31, 0, Math.PI * 2);
    context.fillStyle = PALETTE.fieldDark;
    context.fill();
    context.lineWidth = 7;
    context.strokeStyle = PALETTE.gold;
    context.stroke();
    context.beginPath();
    context.arc(0, 0, 11, 0, Math.PI * 2);
    context.fillStyle = PALETTE.gold;
    context.fill();
}

function rosette(context) {
    for (let index = 0; index < 4; index++) {
        context.save();
        context.rotate(index * Math.PI / 2);
        leaf(context, 14, 92, 36, PALETTE.wine, PALETTE.gold);
        context.restore();
        context.save();
        context.rotate(index * Math.PI / 2 + Math.PI / 4);
        leaf(context, 20, 62, 16, PALETTE.gold, PALETTE.wine);
        context.restore();
    }
    context.beginPath();
    context.arc(0, 0, 16, 0, Math.PI * 2);
    context.fillStyle = PALETTE.cream;
    context.fill();
}

function scrollArm(context) {
    context.lineCap = 'round';
    context.beginPath();
    context.moveTo(0, -176);
    context.bezierCurveTo(42, -214, -38, -262, 6, -300);
    context.bezierCurveTo(30, -322, 58, -310, 50, -288);
    context.bezierCurveTo(44, -272, 26, -280, 32, -292);
    context.lineWidth = 11;
    context.strokeStyle = PALETTE.gold;
    context.stroke();
    context.lineWidth = 4;
    context.strokeStyle = PALETTE.wine;
    context.stroke();
    for (const [x, y, rotation] of [[22, -224, 0.9], [-16, -256, -0.8]]) {
        context.save();
        context.translate(x, y);
        context.rotate(rotation);
        leaf(context, 0, 34, 12, PALETTE.cream, PALETTE.wine);
        context.restore();
    }
}

function cornerDiamond(context) {
    context.rotate(Math.PI / 4);
    context.fillStyle = PALETTE.brown;
    context.fillRect(-26, -26, 52, 52);
    context.lineWidth = 5;
    context.strokeStyle = PALETTE.gold;
    context.strokeRect(-26, -26, 52, 52);
    context.fillStyle = PALETTE.cream;
    context.fillRect(-8, -8, 16, 16);
}

async function renderCarpet(detailSource) {
    const size = 1024;
    const random = seededRandom(5);
    const pattern = createCanvas(size);
    const context = pattern.getContext('2d');
    context.fillStyle = PALETTE.field;
    context.fillRect(0, 0, size, size);
    for (let index = 0; index < 90; index++) {
        const x = random() * size;
        const y = random() * size;
        const radius = 40 + random() * 140;
        const shade = random() > 0.5 ? 'rgba(40, 0, 0, 0.07)' : 'rgba(255, 140, 110, 0.035)';
        drawWrapped(context, size, x, y, radius, (ctx) => {
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = shade;
            ctx.fill();
        });
    }
    context.strokeStyle = 'rgba(58, 6, 7, 0.55)';
    context.lineWidth = 3;
    for (let offset = -size; offset <= size * 2; offset += 128) {
        context.beginPath();
        context.moveTo(offset, 0);
        context.lineTo(offset + size, size);
        context.moveTo(offset, size);
        context.lineTo(offset + size, 0);
        context.stroke();
    }
    for (let cellX = 0; cellX < 2; cellX++) {
        for (let cellY = 0; cellY < 2; cellY++) {
            const x = 256 + cellX * 512;
            const y = 256 + cellY * 512;
            const main = (cellX + cellY) % 2 === 0;
            drawWrapped(context, size, cellX * 512, cellY * 512, 40, cornerDiamond);
            if (main) {
                drawWrapped(context, size, x, y, 340, (ctx) => {
                    for (let arm = 0; arm < 4; arm++) {
                        ctx.save();
                        ctx.rotate(arm * Math.PI / 2 + Math.PI / 4);
                        scrollArm(ctx);
                        ctx.scale(-1, 1);
                        ctx.rotate(0.22);
                        scrollArm(ctx);
                        ctx.restore();
                    }
                    medallion(ctx);
                });
            } else {
                drawWrapped(context, size, x, y, 100, rosette);
            }
        }
    }
    const softened = createCanvas(size);
    const softContext = softened.getContext('2d');
    softContext.filter = 'blur(1.4px)';
    for (const offsetX of [-size, 0, size]) {
        for (const offsetY of [-size, 0, size]) softContext.drawImage(pattern, offsetX, offsetY);
    }
    softContext.filter = 'none';
    const detail = await loadImage(detailSource);
    applyDetail(softened, luminanceField(detail, size, size), 0.55, random, 0.08);
    return softened.toDataURL('image/webp', 0.86);
}

async function renderDamask(fabricSource) {
    const size = 1024;
    const fabric = await loadImage(fabricSource);
    const canvas = createCanvas(size);
    const context = canvas.getContext('2d');
    context.drawImage(fabric, 0, 0, size, size);
    // Deepen towards the mahogany red described in the level records. The scan's
    // jacquard only varies by a few percent, so stretch it by its deviation.
    const pixels = context.getImageData(0, 0, size, size);
    const { data } = pixels;
    const luminance = new Float32Array(size * size);
    let mean = 0;
    for (let index = 0; index < luminance.length; index++) {
        luminance[index] = data[index * 4] * 0.299 + data[index * 4 + 1] * 0.587 + data[index * 4 + 2] * 0.114;
        mean += luminance[index] / luminance.length;
    }
    let variance = 0;
    for (const value of luminance) variance += (value - mean) ** 2 / luminance.length;
    const deviation = Math.sqrt(variance) || 1;
    for (let index = 0; index < luminance.length; index++) {
        const factor = Math.max(0.45, Math.min(1.6, 1 + (luminance[index] - mean) / deviation * 0.14));
        data[index * 4] = Math.min(255, 150 * factor);
        data[index * 4 + 1] = Math.min(255, 20 * factor);
        data[index * 4 + 2] = Math.min(255, 26 * factor);
    }
    context.putImageData(pixels, 0, 0);
    return canvas.toDataURL('image/webp', 0.86);
}

async function renderPlaster(plasterSource) {
    const plaster = await loadImage(plasterSource);
    const canvas = createCanvas(512);
    canvas.getContext('2d').drawImage(plaster, 0, 0, 512, 512);
    return canvas.toDataURL('image/webp', 0.84);
}

function raisedPanel(context, x, y, width, height) {
    const bevel = 18;
    context.fillStyle = '#b9ab8c';
    context.fillRect(x - 5, y - 5, width + 10, height + 10);
    context.fillStyle = '#fbf5e6';
    context.beginPath();
    context.moveTo(x, y);
    context.lineTo(x + width, y);
    context.lineTo(x + width - bevel, y + bevel);
    context.lineTo(x + bevel, y + bevel);
    context.lineTo(x + bevel, y + height - bevel);
    context.lineTo(x, y + height);
    context.closePath();
    context.fill();
    context.fillStyle = '#cbbd9f';
    context.beginPath();
    context.moveTo(x + width, y);
    context.lineTo(x + width, y + height);
    context.lineTo(x, y + height);
    context.lineTo(x + bevel, y + height - bevel);
    context.lineTo(x + width - bevel, y + height - bevel);
    context.lineTo(x + width - bevel, y + bevel);
    context.closePath();
    context.fill();
    context.fillStyle = '#ebe1cb';
    context.fillRect(x + bevel, y + bevel, width - bevel * 2, height - bevel * 2);
}

async function renderDoor(plasterSource) {
    const random = seededRandom(17);
    const canvas = createCanvas(512, 1024);
    const context = canvas.getContext('2d');
    context.fillStyle = '#efe6d1';
    context.fillRect(0, 0, 512, 1024);
    raisedPanel(context, 62, 74, 172, 492);
    raisedPanel(context, 278, 74, 172, 492);
    raisedPanel(context, 62, 628, 172, 322);
    raisedPanel(context, 278, 628, 172, 322);
    context.fillStyle = 'rgba(0, 0, 0, 0.18)';
    context.fillRect(0, 1004, 512, 20);
    const plaster = await loadImage(plasterSource);
    applyDetail(canvas, luminanceField(plaster, 512, 1024), 0.35, random, 0.03);
    return canvas.toDataURL('image/webp', 0.86);
}

globalThis.renderHotelTextures = async (sources) => ({
    carpet: await renderCarpet(sources.carpetDetail),
    damask: await renderDamask(sources.damask),
    plaster: await renderPlaster(sources.plaster),
    door: await renderDoor(sources.plaster),
});
</script>
</body>
</html>
