<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms social preview artwork</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
        body {
            background: #0a0a08;
            color: #d4c97a;
            font-family: "IBM Plex Mono", monospace;
        }
        .terminal {
            position: absolute; inset: 28px;
            border: 1px solid #474331;
            background: radial-gradient(ellipse at 70% 40%, #24231955, transparent 65%), #0d0d0a;
        }
        .terminal::before {
            content: ""; position: absolute; top: -1px; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, #d9c98a, transparent);
        }
        header {
            height: 64px; padding: 0 32px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #393625;
            font-size: 12px; letter-spacing: 2.3px; color: #a89e6e;
        }
        .status { color: #d9c98a; font-size: 11px; letter-spacing: 1.5px; }
        .status::before { content: ""; display: inline-block; width: 6px; height: 6px; background: #d9c98a; margin-right: 10px; }
        .copy { position: absolute; left: 38px; top: 112px; }
        .eyebrow { margin: 0 0 26px; font-size: 13px; letter-spacing: 4px; color: #9d9364; }
        h1 {
            margin: 0; font-family: "Special Elite", monospace; font-weight: 400;
            font-size: 78px; line-height: 1.05; letter-spacing: 5px; color: #e0d596;
        }
        .subtitle { margin: 13px 0 30px; font-size: 17px; letter-spacing: 9px; color: #c2b67f; }
        .invitation { margin: 0; font-size: 19px; line-height: 1.7; color: #b3aa81; }
        .cta {
            display: inline-flex; align-items: center; gap: 30px; margin-top: 27px; padding: 14px 19px;
            border: 1px solid #b9ac70; background: #d9c98a0b;
            font-size: 13px; letter-spacing: 2px; color: #e0d596;
        }
        .room {
            position: absolute; top: 94px; right: 32px; width: 510px; height: 375px;
            border: 1px solid #9d925e; border-bottom: 3px solid #d9c98a;
            background: #35331c; overflow: hidden;
            clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 0 100%);
        }
        .room img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.85) saturate(.75); }
        .room::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #0a0a0822 25%, transparent 45%, #0a0a08ee 100%); }
        .badge { position: absolute; left: 22px; top: 22px; z-index: 1; border: 1px solid #d9c98a88; background: #0a0a08bb; padding: 7px 10px; font-size: 11px; letter-spacing: 1.7px; }
        .room-caption { position: absolute; left: 24px; right: 24px; bottom: 24px; z-index: 1; }
        .room-caption small { font-size: 11px; letter-spacing: 2px; color: #c3b98a; }
        .room-caption h2 { font-family: "Special Elite", monospace; font-size: 38px; font-weight: 400; margin: 12px 0 0; letter-spacing: 2px; color: #e0d596; }
        footer {
            position: absolute; left: 0; right: 0; bottom: 0; height: 76px;
            display: flex; align-items: center; padding: 0 33px; gap: 35px; border-top: 1px solid #393625;
            font-size: 11px; letter-spacing: 1.2px;
        }
        footer strong { font-weight: 400; color: #e0d596; }
        .sealed { color: #777159; }
        .browser { margin-left: auto; color: #aaa076; letter-spacing: 1.5px; }
        .scanlines {
            position: absolute; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, #00000019 2px, #00000019 4px);
        }
    </style>
</head>
<body>
    <main class="terminal">
        <header><span>&gt; RECURSIVE ACCESS TERMINAL</span><span class="status">SIGNAL DETECTED</span></header>
        <div class="copy">
            <p class="eyebrow">CHOOSE YOUR DESCENT</p>
            <h1>BACKROOMS</h1>
            <p class="subtitle">SIGNAL LOST</p>
            <p class="invitation">Follow the ringing.<br>Find a way out.</p>
            <div class="cta">ENTER LEVEL 0 <span>→</span></div>
        </div>
        <div class="room">
            <img src="../public/graphics/lobby-preview.jpg" alt="Endless yellow rooms beneath fluorescent lights">
            <span class="badge">LEVEL 0 / SURVIVAL</span>
            <div class="room-caption"><small>// CONNECTION ESTABLISHED</small><h2>The Lobby</h2></div>
        </div>
        <footer>
            <strong>01 / THE LOBBY</strong>
            <span class="sealed">02 / HOTEL · SEALED</span>
            <span class="sealed">03 / POOLS · SEALED</span>
            <span class="browser">PLAY IN YOUR BROWSER ↗</span>
        </footer>
    </main>
    <div class="scanlines"></div>
</body>
</html>
